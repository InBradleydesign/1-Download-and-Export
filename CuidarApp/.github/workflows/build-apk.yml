name: Build APK

on:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - 'CuidarApp/**'
  pull_request:
    branches:
      - main
    paths:
      - 'CuidarApp/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: CuidarApp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CuidarApp-debug
          path: CuidarApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: CuidarApp/app/build/reports/tests/
          retention-days: 7

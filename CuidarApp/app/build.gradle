plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cuidarapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.cuidarapp"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.5.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    // Atualizações por cima da versão instalada (mantendo os dados) exigem que
    // todas as versões sejam assinadas com a MESMA chave. A chave nunca fica no
    // repositório: vem de variáveis de ambiente (CI) ou de keystore.properties.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def signingValue = { String envName, String propName ->
        System.getenv(envName) ?: keystoreProps.getProperty(propName)
    }
    def releaseStoreFile = signingValue('CUIDARAPP_KEYSTORE_FILE', 'storeFile')
    def hasReleaseSigning = releaseStoreFile != null && rootProject.file(releaseStoreFile).exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('CUIDARAPP_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('CUIDARAPP_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('CUIDARAPP_KEY_PASSWORD', 'keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // WebView
    implementation 'androidx.webkit:webkit:1.9.0'
    
    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    
    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Core library desugaring for LocalDate/LocalTime support
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
